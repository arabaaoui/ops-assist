apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ops-assist
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    spec:
      containers:
        - image: example.invalid/ops-assist:1.0.0
          command: [python, -m, uvicorn]
          args: ["ops_assist.a2a_server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: OPS_ASSIST_A2A_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-assist-a2a-token
                  key: latest
