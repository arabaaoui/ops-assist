# Start the proxy bound to localhost: `litellm --config deploy/litellm/config.yaml --host 127.0.0.1`.
# Without --host, LiteLLM listens on 0.0.0.0 (all interfaces); never expose it without TLS and a master key.
# Proxy credentials are read from the environment; never put values in this file.
model_list:
  - model_name: ops-primary
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: ops-backup
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_PROVIDER_API_KEY
router_settings:
  fallbacks:
    - ops-primary: [ops-backup]
litellm_settings:
  turn_off_message_logging: true
general_settings:
  disable_spend_logs: false
  store_prompts_in_spend_logs: false
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
# Create a virtual key via POST /key/generate with:
# {"models": ["ops-primary", "ops-backup"], "max_budget": 5,
#  "budget_duration": "30d", "rpm_limit": 10, "tpm_limit": 10000}
# Per-key budgets and spend logs require the proxy's PostgreSQL database.
