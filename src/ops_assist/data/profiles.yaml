# Model profiles. Pick one with OPS_ASSIST_PROFILE (default: local).
# Model ids are LiteLLM ids ("provider/model"). They are examples: providers rename
# models often, so override them with OPS_ASSIST_MODELS="id1,id2" rather than editing code.
# The first model is the primary; the next ones are tried in order when a call fails
# with a retriable status (rate limit, server error), never on a malformed request.
profiles:
  local:
    description: Runs on your machine through Ollama. No account, no cost; needs a model that can call tools.
    models: ["ollama_chat/qwen3:8b"]
    api_base: http://localhost:11434
  api:
    description: A hosted provider with a free tier. Needs an API key in the provider's usual variable (e.g. GEMINI_API_KEY).
    models: ["gemini/gemini-2.5-flash", "gemini/gemini-2.5-flash-lite"]
